name: Update Financial Data

on:
  schedule:
    - cron: "0 12 * * 1-5"   # 08:00 BOT
    - cron: "0 16 * * 1-5"   # 12:00 BOT
    - cron: "0 22 * * 1-5"   # 18:00 BOT
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changes_detected }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install httpx beautifulsoup4 yfinance

      - name: Fetch prices
        run: python scripts/fetch_prices.py

      - name: Commit updated data
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: update financial data"
          file_pattern: data/prices.json

      - name: Trigger deploy
        if: steps.commit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml
