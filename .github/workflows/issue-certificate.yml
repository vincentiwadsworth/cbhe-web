name: Issue Certificate

on:
  workflow_dispatch:
    inputs:
      empresa_nombre:
        description: "Nombre de la empresa"
        required: true
        type: string
      tipo_certificacion:
        description: "Tipo de certificación"
        required: true
        type: string
      fecha_emision:
        description: "Fecha de emisión (YYYY-MM-DD)"
        required: true
        type: string
      fecha_vencimiento:
        description: "Fecha de vencimiento (YYYY-MM-DD, opcional)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  issue:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Puppeteer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxrandr2 libgbm1 \
            libpango-1.0-0 libcairo2 libasound2t64

      - name: Issue certificate
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          PUBLIC_VERIFICATION_URL: ${{ secrets.PUBLIC_VERIFICATION_URL }}
        run: |
          node scripts/issue-certificate.mjs \
            --empresa "${{ inputs.empresa_nombre }}" \
            --tipo "${{ inputs.tipo_certificacion }}" \
            --fecha-emision "${{ inputs.fecha_emision }}" \
            --output ./certificates \
            $([ -n "${{ inputs.fecha_vencimiento }}" ] && echo '--fecha-vencimiento "${{ inputs.fecha_vencimiento }}"' || true)

      - name: Upload certificate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: certificate
          path: certificates/
          retention-days: 30
