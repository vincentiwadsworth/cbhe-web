name: Supabase keepalive

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Ping a la base de datos (evita la pausa por inactividad)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/capacitacion?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}")
          echo "Respuesta HTTP: $code"
          test "$code" = "200"

      - name: Abrir issue si el ping fallo
        if: failure()
        run: |
          existing=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/search/issues?q=repo:${{ github.repository }}+is:issue+is:open+label:%22fallo+de+sistema%22" \
            | grep -o '"total_count": *[0-9]*' | grep -o '[0-9]*')
          if [ "$existing" = "0" ]; then
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/issues \
              -d '{
              "title": "La base de datos CBHE no responde",
              "body": "El ping diario a Supabase fallo. Si esto se repite varios dias, la base de datos esta pausada o caida y la verificacion de QR no funciona.\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nQue hacer: entrar a supabase.com con la cuenta de la CBHE y pulsar Restore project. Cierre este issue cuando este restaurado.",
              "labels": ["fallo de sistema"]
              }'
            echo "Issue creado"
          else
            echo "Ya existe un issue abierto de fallo de sistema, no se duplica"
          fi
