name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx astro build
        env:
          WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4

  avisar_fallo:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Abrir issue de fallo de deploy
        run: |
          existing=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues?state=open&labels=fallo%20de%20sistema" \
            | jq 'length')
          if [ "$existing" = "0" ]; then
            curl -s -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/${{ github.repository }}/issues \
              -d '{
              "title": "Fallo de deploy: la web no se esta actualizando",
              "body": "El deploy fallo en el commit ${{ github.sha }}. Mientras este issue este abierto, el sitio no publica cambios nuevos.\n\nDetalle tecnico: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nCausa tipica: un contenido guardado desde el CMS con datos invalidos. Revise los ultimos cambios con la guia de editores, seccion 10. Cierre este issue cuando este corregido.",
              "labels": ["fallo de sistema"]
              }'
            echo "Issue creado"
          else
            echo "Ya existe un issue abierto de fallo de sistema, no se duplica"
          fi
