      command: npx astro build
      note: Primary quality gate — enforced by workflow rules

phases:
  propose:
    rules:
      - Must include Intent, Scope, Capabilities, Approach, Risks
      - Keep scope clearly bounded (In Scope / Out of Scope)
  spec:
    rules:
      - Write delta specs only (no full re-documentation)
      - Include requirements table and verification scenarios
  design:
    rules:
      - Focus on architecture decisions and component design
      - Reference existing MD3 tokens; no new tokens without justification
  tasks:
    rules:
      - Break into reviewable work units (<400 lines per PR)
      - Tests: N/A (no test runner) — build verification as quality gate
  apply:
    rules:
      - Follow AGENTS.md workflow: build → verify → commit → push
      - Use conventional commits; NEVER add AI attribution
      - Must verify npx astro build passes before committing
  verify:
    rules:
      - Primary: npx astro build (must succeed)
      - Secondary: npx astro check for type errors
      - Manual: visual inspection of dist/ output
      - Domain-specific: verify test scenario outcomes from spec
  archive:
    rules:
      - Move delta specs to changes/archive/{date}-{change-name}/
      - Sync openspec context if architecture changed
