context: |
  CBHE institutional website for the Bolivian Chamber of Hydrocarbons and Energy.
  Astro 6.2 static site (SSG), Tailwind v4 CSS, deployed to GitHub Pages.
  Content: 4 Zod-validated collections (cursos, articulos, empresas, testimonios).
  CMS: Sveltia CMS at public/admin/ (GitHub backend).
  Auth: GitHub Pages + gh CLI (vincentiwadsworth).
  AI: Groq-powered chatbot (multi-ai-sdk via esm.sh).
  Forms: Web3Forms.
  Icons: astro-icon + 77 Material Symbols.
  Fonts: Inter self-hosted (Latin subset, weights 400-800).
  Design: 50 MD3 tokens in CSS @theme (zero pure white backgrounds).
  Certifications: Supabase-backed verification page with QR codes.
  Supabase: Certificate storage (certificados table, anon SELECT RLS).

